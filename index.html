<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Friendship Day ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #05020a;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 1. PINK DIGITAL RAIN CANVAS */
    #pinkRainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* MAIN CONTAINER */
    .container {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 900px;
      text-align: center;
      background: rgba(18, 5, 25, 0.88);
      backdrop-filter: blur(14px);
      padding: 40px 20px;
      border-radius: 24px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.25);
      margin: 20px 0;
    }

    /* PAGE 1: QUESTION SCREEN */
    #page1 h1 {
      font-size: 2.8rem;
      color: #f472b6;
      text-shadow: 0 0 15px rgba(244, 114, 182, 0.8), 0 0 30px rgba(236, 72, 153, 0.4);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    #page1 p.sub-text {
      font-size: 1.4rem;
      color: #fbcfe8;
      text-shadow: 0 0 8px rgba(251, 207, 232, 0.5);
      margin-bottom: 70px;
    }

    /* BUTTON ZONE */
    .button-zone {
      position: relative;
      width: 100%;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .btn {
      padding: 14px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
    }

    #yesBtn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: white;
      z-index: 5;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yesBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.8);
    }

    #noBtn {
      position: absolute;
      background: #334155;
      color: #94a3b8;
      z-index: 10;
      transition: left 0.15s ease-out, top 0.15s ease-out;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* PAGE 2: MAIN WISH & SURROUNDING PHOTOS */
    #page2 {
      display: none;
    }

    .quote-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid #f472b6;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 25px;
      color: #fbcfe8;
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .main-wish-header {
      margin: 30px 0;
    }

    .main-wish {
      font-size: 2.6rem;
      color: #f472b6;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.9), 0 0 35px rgba(236, 72, 153, 0.6);
      margin-bottom: 8px;
    }

    /* GRID FOR 5 PHOTO CARDS SURROUNDING THE WISH */
    .surround-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .photo-slot {
      background: rgba(30, 20, 40, 0.9);
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(244, 114, 182, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      position: relative;
    }

    /* PLUS ICON FOR UNFILLED SLOTS */
    .plus-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(244, 114, 182, 0.15);
      border: 2px dashed #f472b6;
      color: #f472b6;
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(244, 114, 182, 0.2);
    }

    .plus-btn:hover {
      transform: scale(1.1);
      background: rgba(244, 114, 182, 0.3);
      box-shadow: 0 0 25px rgba(244, 114, 182, 0.5);
    }

    /* LOCKED DISPLAYED IMAGE */
    .photo-slot img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .photo-slot .caption {
      color: #fbcfe8;
      font-size: 0.92rem;
      line-height: 1.4;
      font-style: italic;
      text-align: center;
    }

    /* Hidden file inputs */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- PINK DIGITAL RAIN CANVAS -->
  <canvas id="pinkRainCanvas"></canvas>

  <div class="container">
    <!-- PAGE 1 -->
    <div id="page1">
      <h1>Happy Friendship Day</h1>
      <p class="sub-text">Will you be my friend forever?</p>

      <div class="button-zone" id="btnZone">
        <button class="btn" id="yesBtn" onclick="goToPage2()">YES! ❤️</button>
        <button class="btn" id="noBtn">NO 😜</button>
      </div>
    </div>

    <!-- PAGE 2 -->
    <div id="page2">
      <!-- Friendship Quote -->
      <div class="quote-box">
        "Friendship is not about who you've known the longest... It's about who came into your life, said 'I'm here for you,' and proved it." ✨
      </div>

      <!-- Center Wish -->
      <div class="main-wish-header">
        <h1 class="main-wish">Happy Friendship Day, Chinmudra! 💖</h1>
      </div>

      <!-- 5 Photo Slots Surrounding Wish -->
      <div class="surround-grid" id="surroundGrid">
        <!-- Slot 0 -->
        <div class="photo-slot" id="slot-0">
          <div class="plus-btn" onclick="triggerUpload(0)">+</div>
          <input type="file" id="input-0" accept="image/*" onchange="uploadSinglePhoto(event, 0)" />
        </div>
        <!-- Slot 1 -->
        <div class="photo-slot" id="slot-1">
          <div class="plus-btn" onclick="triggerUpload(1)">+</div>
          <input type="file" id="input-1" accept="image/*" onchange="uploadSinglePhoto(event, 1)" />
        </div>
        <!-- Slot 2 -->
        <div class="photo-slot" id="slot-2">
          <div class="plus-btn" onclick="triggerUpload(2)">+</div>
          <input type="file" id="input-2" accept="image/*" onchange="uploadSinglePhoto(event, 2)" />
        </div>
        <!-- Slot 3 -->
        <div class="photo-slot" id="slot-3">
          <div class="plus-btn" onclick="triggerUpload(3)">+</div>
          <input type="file" id="input-3" accept="image/*" onchange="uploadSinglePhoto(event, 3)" />
        </div>
        <!-- Slot 4 -->
        <div class="photo-slot" id="slot-4">
          <div class="plus-btn" onclick="triggerUpload(4)">+</div>
          <input type="file" id="input-4" accept="image/*" onchange="uploadSinglePhoto(event, 4)" />
        </div>
      </div>
    </div>
  </div>

  <script>
    /* 1. PINK RAIN MATRIX ANIMATION */
    const canvas = document.getElementById('pinkRainCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const pinkChars = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ💕✨🌸💖';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawPinkRain() {
      ctx.fillStyle = 'rgba(5, 2, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f472b6';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = pinkChars.charAt(Math.floor(Math.random() * pinkChars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawPinkRain, 33);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    /* 2. IMPOSSIBLE 'NO' BUTTON DODGE LOGIC */
    const noBtn = document.getElementById('noBtn');
    const btnZone = document.getElementById('btnZone');

    function resetNoPosition() {
      noBtn.style.left = `calc(50% + 120px)`;
      noBtn.style.top = `20px`;
    }
    resetNoPosition();

    function moveNoBtnAway() {
      const zoneRect = btnZone.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = zoneRect.width - btnRect.width;
      const maxY = zoneRect.height - btnRect.height;

      let newX = Math.random() * maxX;
      let newY = Math.random() * maxY;

      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    }

    noBtn.addEventListener('mouseenter', moveNoBtnAway);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoBtnAway();
    });

    /* 3. SWITCH TO PAGE 2 & CONFETTI */
    function goToPage2() {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'block';

      confetti({
        particleCount: 160,
        spread: 90,
        origin: { y: 0.5 },
        colors: ['#f472b6', '#ec4899', '#ffffff']
      });

      renderLockedPhotos();
    }

    /* 4. PERMANENT IMAGE UPLOADER & LOCK SYSTEM */
    const photoCaptions = [
      "\"In the story of my life, having you as a friend is my absolute favorite chapter.\" ✨",
      "\"True friendship isn't about being inseparable—it's knowing nothing changes even when life gets busy.\" 💖",
      "\"Through every high and low, thank you for being my constant light and strength.\" 🌸",
      "\"Good times become unforgettable memories simply because you are there to share them.\" 🥳",
      "\"Here's to forever being each other's person. Happy Friendship Day, Chinmudra!\" 🎉"
    ];

    function triggerUpload(index) {
      // Check if slot is already locked
      let lockedPhotos = JSON.parse(localStorage.getItem('chinmudra_locked_slots') || '{}');
      if (lockedPhotos[index]) {
        return; // Slot is locked permanently
      }
      document.getElementById(`input-${index}`).click();
    }

    function uploadSinglePhoto(event, index) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        let lockedPhotos = JSON.parse(localStorage.getItem('chinmudra_locked_slots') || '{}');
        
        // Save photo permanently to slot
        lockedPhotos[index] = {
          imgSrc: e.target.result,
          caption: photoCaptions[index]
        };

        localStorage.setItem('chinmudra_locked_slots', JSON.stringify(lockedPhotos));
        renderLockedPhotos();
      };

      reader.readAsDataURL(file);
    }

    function renderLockedPhotos() {
      let lockedPhotos = JSON.parse(localStorage.getItem('chinmudra_locked_slots') || '{}');

      for (let i = 0; i < 5; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        if (lockedPhotos[i]) {
          // Permanently locked state: show image and caption, completely remove file input & plus icon
          slotEl.innerHTML = `
            <img src="${lockedPhotos[i].imgSrc}" alt="Memory with Chinmudra" />
            <p class="caption">${lockedPhotos[i].caption}</p>
          `;
          slotEl.style.cursor = "default";
        }
      }
    }
  </script>
</body>
</html>
